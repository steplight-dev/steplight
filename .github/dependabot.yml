version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dependabot applies a default 3-day cooldown and hands it to pnpm as a release-age gate
    # (minimum-release-age=4320). We keep a slightly longer wait than that default on purpose:
    # patch = 3 + 1 days, minor and major = 7 days. Security updates ignore cooldown.
    cooldown:
      default-days: 4
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 4
    # (pnpm-workspace.yaml disables pnpm's own release-age gate; this cooldown is what applies. DECISIONS.md 137.)
    # Majors of the build toolchain, React and commander wait until after the 0.1.0 release. @types/node must keep
    # tracking the minimum supported Node (20), so its majors are never proposed.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript-eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The same cooldown as npm: patch 4 days, minor and major 7. Security updates ignore cooldown.
    cooldown:
      default-days: 4
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 4
    # Browser Use is pinned to the range the integration is tested against (python/pyproject.toml); a new
    # minor series is adopted by hand, after running the Browser Use tests against it.
    ignore:
      - dependency-name: browser-use
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python-dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      python-production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(python)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
