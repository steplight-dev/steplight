name: Dependency audit

on:
  pull_request:
    paths: [pnpm-lock.yaml, "**/package.json", python/uv.lock, python/pyproject.toml]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (high and above)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Export the locked runtime tree of the package and its extras (without Browser Use)
        working-directory: python
        run: uv export --frozen --no-dev --extra playwright --extra crypto --extra otel --no-emit-project --no-hashes -o ../audit-core.txt
      # Fails on any known vulnerability in what `pip install steplight[playwright,crypto,otel]` brings in.
      - name: Audit (fails on any finding)
        working-directory: python
        run: uv run --frozen pip-audit -r ../audit-core.txt --no-deps --disable-pip --strict
      - name: Export the locked tree of the Browser Use extra
        working-directory: python
        run: uv export --frozen --no-dev --extra browser-use --no-emit-project --no-hashes -o ../audit-browser-use.txt
      # Browser Use pins old versions of aiohttp, pypdf, pillow, mcp and anyio. Those are not ours to fix, so the
      # findings are reported as a warning (DECISIONS.md 184) instead of failing every build.
      - name: Audit Browser Use's dependencies (reported, not failing)
        working-directory: python
        run: |
          if ! uv run --frozen pip-audit -r ../audit-browser-use.txt --no-deps --disable-pip > ../audit-browser-use.log 2>&1; then
            echo "::warning::pip-audit found known vulnerabilities in packages pinned by browser-use (see the log of this step)"
            tail -n 40 ../audit-browser-use.log
          fi
