name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright is a dependency of the extension package, not of the workspace root
      - run: pnpm --filter @steplight/extension exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm demo

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance and fixtures tests run the built Node CLI and the repository's fixtures site.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install the package and its test tools (locked)
        working-directory: python
        run: uv sync --frozen
      - name: Install Chromium
        working-directory: python
        run: uv run playwright install --with-deps chromium
      - name: Lint and format
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check (mypy --strict)
        working-directory: python
        run: uv run mypy
      - name: Tests (unit, redaction vectors, Playwright, conformance with the Node CLI, cross-language encryption, Browser Use)
        working-directory: python
        run: uv run pytest -q
      - name: Browser Use at the oldest supported version
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        working-directory: python
        run: uv run --with "browser-use==0.7.12" pytest tests/test_browser_use.py -q
